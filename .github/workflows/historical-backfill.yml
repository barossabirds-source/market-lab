name: Market Lab historical backfill

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * 0"
  push:
    branches:
      - main
    paths:
      - "scripts/backfill_federal_register.py"
      - "scripts/backfill_federal_register_point_in_time.py"
      - "scripts/refine_historical_discoveries.py"
      - "scripts/enrich_market_context.py"
      - "scripts/analyze_market_context.py"
      - "scripts/apply_context_reviews.py"
      - "scripts/update_future_trials.py"
      - ".github/workflows/historical-backfill.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check database secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase secrets are not configured; skipping safely."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Collect official candidates using source-available publication dates
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/backfill_federal_register_point_in_time.py
      - name: Refine discoveries for duplicate and overlapping events
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/refine_historical_discoveries.py
      - name: Add pre-event market backdrop
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/enrich_market_context.py
      - name: Analyse simple pre-event market conditions
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/analyze_market_context.py
      - name: Reapply manual review decisions
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/apply_context_reviews.py
      - name: Update frozen trials that use official candidates
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/update_future_trials.py
