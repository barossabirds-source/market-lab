name: Research checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/research-gate-ui.test.cjs tests/research-gate-adapters.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - run: python -m unittest discover -s tests -p 'test_research_gate.py'
      - run: python -m unittest discover -s tests -p 'test_pair_trade_evidence.py'
